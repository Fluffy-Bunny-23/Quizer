<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="rounded">
      <rect width="100" height="100" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Background quadrants -->
    <rect x="0" y="0" width="50" height="50" fill="#e74c3c"/>
    <rect x="50" y="0" width="50" height="50" fill="#3b82f6"/>
    <rect x="0" y="50" width="50" height="50" fill="#fbbf24"/>
    <rect x="50" y="50" width="50" height="50" fill="#4ade80"/>

    <!-- Shapes -->
    <polygon points="25,15 10,40 40,40" fill="white"/>
    <rect x="60" y="20" width="20" height="20" transform="rotate(45 70 30)" fill="white"/>
    <circle cx="25" cy="75" r="15" fill="white"/>
    <rect x="60" y="60" width="25" height="25" rx="5" fill="white"/>
  </g>
</svg>
